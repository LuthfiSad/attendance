name: Quadrang Auto Attendance

on:
  schedule:
    # 00:15 UTC = 07:15 WIB (Senin - Jumat) -> Delay acak 0 s/d 15 menit (07:15 - 07:30 WIB)
    - cron: '15 0 * * 1-5'
    # 09:30 UTC = 16:30 WIB (Senin - Jumat) -> Delay acak 0 s/d 30 menit (16:30 - 17:00 WIB)
    - cron: '30 9 * * 1-5'

  # Tombol manual di tab Actions GitHub untuk testing kapan saja
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pilih Mode Absen'
        required: true
        default: 'pagi'
        type: choice
        options:
          - pagi
          - sore

jobs:
  run-attendance:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tentukan Mode (Pagi / Sore)
        id: determine-mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "MODE=${{ github.event.inputs.mode }}" >> $GITHUB_ENV
          else
            UTC_HOUR=$(date -u +%H)
            if [ "$UTC_HOUR" -lt 5 ]; then
              echo "MODE=pagi" >> $GITHUB_ENV
            else
              echo "MODE=sore" >> $GITHUB_ENV
            fi
          fi

      - name: Eksekusi Absensi
        env:
          QUADRANG_USERNAME: ${{ secrets.QUADRANG_USERNAME }}
          QUADRANG_PASSWORD: ${{ secrets.QUADRANG_PASSWORD }}
          QUADRANG_LAT: ${{ secrets.QUADRANG_LAT }}
          QUADRANG_LON: ${{ secrets.QUADRANG_LON }}
        run: |
          node local-test.js $MODE

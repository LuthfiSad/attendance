name: Quadrang Auto Attendance

on:
  # Ditembak langsung oleh Vercel Cron via GitHub API
  repository_dispatch:
    types: [trigger-attendance]

  # Tombol manual di tab Actions GitHub untuk testing kapan saja
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pilih Mode Absen'
        required: true
        default: 'pagi'
        type: choice
        options:
          - pagi
          - sore

jobs:
  run-attendance:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tentukan Mode dari Payload
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "MODE=${{ github.event.client_payload.mode }}" >> $GITHUB_ENV
          else
            echo "MODE=${{ github.event.inputs.mode }}" >> $GITHUB_ENV
          fi

      - name: Eksekusi Absensi
        env:
          QUADRANG_USERNAME: ${{ secrets.QUADRANG_USERNAME }}
          QUADRANG_PASSWORD: ${{ secrets.QUADRANG_PASSWORD }}
          QUADRANG_LAT: ${{ secrets.QUADRANG_LAT }}
          QUADRANG_LON: ${{ secrets.QUADRANG_LON }}
        run: |
          node local-test.js $MODE
